# Security scan
# OWASP dependency-check (vulnerability scanning),
# pgpverify-maven-plugin (dependency/plugin PGP signature) verification runs implicitly,
# see the comment above "Analyze dependencies" below.
#
# NVD data source: COMMUNITY MIRROR - candid notice before you rely on this variant:
#   This workflow's NVD database comes from https://github.com/chenhuawei/nvd-mirror, an
#   UNOFFICIAL, third-party GitHub project that periodically republishes a prebuilt
#   dependency-check database as a GitHub Release. It is NOT operated or vetted by NIST, OWASP,
#   or GitHub, has no SLA, and could stop publishing, change format, or (in the worst case) be
#   compromised without warning - the sha256 checksum step below only proves the archive you
#   downloaded matches what that project published, not that what it published is trustworthy.
#   Pros: fast, low CI cost - no NVD rate limits, no multi-hour cold-start sync.
#   Cons: the third-party trust tradeoff above; no SLA.
# If that tradeoff is unacceptable for this repo, use security-scan.official-nvd.yml.tmpl
# instead, which talks to the official NVD REST API directly at the cost of slower/rate-limited
# syncs.

name: Security scan
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_check:
    name: OWASP dependency-check (community mirror)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && github.head_ref != 'release-please--branches--main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to comment on the PR with findings
      issues: write   # required to file/update/close the vulnerability tracking issue
      security-events: write   # required by github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # dependency-check's own full NVD sync is rate-limited and can take 6h+ from a cold
      # start. Instead of letting it talk to NVD directly, prime it from a pre-built snapshot
      # published as a GitHub Release by chenhuawei/nvd-mirror (see the candid notice at the
      # top of this file). The release/asset digest changes exactly when the mirror publishes
      # new data, so keying the cache on it gives "refresh whenever the mirror updates" for
      # free via actions/cache's normal restore/save semantics.
      - name: Look up nvd-mirror release metadata
        id: mirror_meta
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/nvd-mirror-lookup-release.sh

      - name: Restore cached NVD database
        id: cache_nvd_db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dependency-check-data
          key: nvd-mirror-db-${{ steps.mirror_meta.outputs.digest }}
          restore-keys: |
            nvd-mirror-db-

      # Not-optional checksum verification happens inside this script (see
      # nvd-mirror-download-database.sh) - it refuses to use an archive whose sha256 doesn't
      # match the digest resolved above, since this snapshot is otherwise unauthenticated
      # third-party data flowing straight into the security scan.
      - name: Download NVD database from mirror
        if: steps.cache_nvd_db.outputs.cache-hit != 'true'
        env:
          MIRROR_URL: ${{ steps.mirror_meta.outputs.url }}
          MIRROR_DIGEST: ${{ steps.mirror_meta.outputs.digest }}
        run: scripts/nvd-mirror-download-database.sh

      # -DautoUpdate=false: dependency-check must ONLY EVER read the snapshot restored/
      # downloaded above, never attempt its own NVD sync - mixing an unauthenticated mirror
      # snapshot with a live partial sync would defeat the point of verifying the download's
      # checksum. NVD_API_KEY is intentionally not passed here: with autoUpdate disabled it
      # would never be consulted anyway.
      - name: Analyze dependencies
        env:
          OSS_INDEX_USERNAME: ${{ secrets.OSS_INDEX_USERNAME }}
          OSS_INDEX_PASSWORD: ${{ secrets.OSS_INDEX_PASSWORD }}
        run: mvn validate dependency-check:check -DdataDirectory=$HOME/dependency-check-data -DautoUpdate=false

      # Everything below runs `if: always()` because the step above fails the build on any
      # finding at/above failBuildOnCVSS (see pom-fragments/dependency-check-plugin.xml) -
      # reporting/badges must still happen then, not only on a clean pass.
      - name: Summarize dependency-check findings
        id: summarize
        if: always()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/dependency-check-summary.md
        run: scripts/summarize-report.sh

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.sarif
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 15

      # Uploads the same SARIF file already produced by "Analyze dependencies" above to GitHub's
      # code-scanning Security tab.
      # `if: always()` for the same reason as the reporting steps above
      # the scan step may already have failed the build via failBuildOnCVSS,
      # but findings should still surface in the Security tab.
      - name: Upload dependency-check SARIF to GitHub code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: target/dependency-check-report.sarif
          category: dependency-check

      # Runs on every PR, clean or not, so the comment always reflects current state instead of
      # leaving a stale "vulnerabilities found" comment after a fix. Only on pull_request - a
      # push/workflow_dispatch/schedule run has no PR to comment on.
      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ steps.summarize.outputs.summary_file }}
        run: scripts/comment-on-pr.sh

      # Issue tracking is restricted to push (post-merge, trusted) rather than every PR run, so
      # an in-review branch can't open a persistent tracking issue before anyone's decided
      # whether the finding is real or relevant. imjohnbo/issue-bot only closes the *previous*
      # tracking issue when a *new* one is filed for a fresh finding, so the second step below
      # (a raw `gh issue close` loop, not an action) covers the case where the scan goes clean
      # again with no new issue to trigger that close.
      - name: File or update tracking issue
        if: always() && github.event_name == 'push' && steps.summarize.outputs.has_vulnerabilities == 'true'
        uses: imjohnbo/issue-bot@3188c6ce06249206709d3b1f274d0d4c5a521601 # v3.4.5
        with:
          title: OWASP dependency-check found vulnerabilities in main
          body: ${{ steps.summarize.outputs.summary }}
          labels: dependency-check
          close-previous: true
          linked-comments: true
      - name: Close tracking issue if resolved
        if: always() && github.event_name == 'push' && steps.summarize.outputs.has_vulnerabilities == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LABEL: dependency-check
        run: scripts/close-resolved-issue.sh

      # Publishes the vulnerability count to the Gist the README's "vulnerabilities" badge reads
      # from. Restricted to push/workflow_dispatch/schedule (never pull_request) so a fork PR
      # can't publish a public badge update.
      - name: Determine vulnerability badge color
        id: vuln_color
        if: always() && github.event_name != 'pull_request'
        env:
          MODE: zero
          VALUE: ${{ steps.summarize.outputs.vulnerability_count }}
        run: echo "value=$(scripts/badge-color.sh)" >> "$GITHUB_OUTPUT"
      - name: Update vulnerability count badge
        if: always() && github.event_name != 'pull_request'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.GIST_ID }}
          filename: vulnerabilities.json
          label: vulnerabilities
          message: ${{ steps.summarize.outputs.vulnerability_count }}
          color: ${{ steps.vuln_color.outputs.value }}
