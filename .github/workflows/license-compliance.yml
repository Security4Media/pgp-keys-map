# Produce a software bill of materials (SBOM) and ensure that the licenses of the
# dependencies are compatible with the project.
#
# Runs on push (excluding release-please's own PR branch) AND on pull requests, so a
# disallowed or missing license is caught before it merges into main, not after.
# This is the recommended trigger shape; see license-compliance.push-only.yml.tmpl for
# the alternative that matches the original push-only reference workflow exactly.

name: License compatibility checks

on:
  push:
    branches-ignore:
      - release-please--branches--main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && github.head_ref != 'release-please--branches--main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Produce SBOM in CycloneDX format
        run: mvn cyclonedx:makeAggregateBom
      - name: Produce concise license report
        run: python3 scripts/license-check.py --sbom target/bom.json --report
      - name: Check license compliance
        run: python3 scripts/license-check.py --sbom target/bom.json --enforce resources/allowed-licenses.txt
